spring.application.name=chatter

# H2 in PostgreSQL-compatibility mode runs the same Flyway migrations as
# production Postgres, so tests exercise the real DDL without a live server.
# A per-run database name keeps parallel/repeated runs isolated.
spring.datasource.url=jdbc:h2:mem:chatter-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

jwt.secret=test-only-secret-key-at-least-256-bits-long-for-the-hs256-signing-algo
jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:3000
