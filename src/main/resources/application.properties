spring.application.name=chatter

server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chat_db}
spring.datasource.username=${DB_USERNAME:chat_user}
spring.datasource.password=${DB_PASSWORD:chat_password}

# Flyway owns the schema. Hibernate only validates entities against it —
# never ddl-auto=update/create-drop, which would fight the migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

# Dev default only. Override with a real secret in any shared environment.
jwt.secret=${JWT_SECRET:dev-only-secret-key-at-least-256-bits-long-override-before-deploying}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated origins allowed to call the API and open a WebSocket.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging.level.com.chatter.chatter=DEBUG

# Presence: in-memory by default so a bare bootRun needs no Redis.
app.presence.redis.enabled=${PRESENCE_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Web Push (VAPID). Disabled unless a key pair is supplied; generate one with
# `npx web-push generate-vapid-keys`. The public key is served to browsers,
# the private key must stay secret.
app.push.vapid.enabled=${VAPID_ENABLED:false}
app.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${VAPID_SUBJECT:mailto:admin@example.com}
