services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chat_db
      DB_USERNAME: chat_user
      DB_PASSWORD: chat_password
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Override for anything beyond local development.
      JWT_SECRET: local-dev-secret-key-at-least-256-bits-long-not-for-production
      # Presence as TTL keys rather than a status column: a server that dies
      # cannot leave anyone stuck "online", because the key expires by itself.
      PRESENCE_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Web Push is off until you supply a VAPID keypair. Generate one with:
      #   npx web-push generate-vapid-keys
      # then export VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY in your shell rather
      # than committing them here. Browsers only allow push over HTTPS or on
      # localhost. Left off, LoggingPushSender takes over and logs instead.
      VAPID_ENABLED: "${VAPID_ENABLED:-false}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:admin@example.com}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
        VITE_WS_URL: ws://localhost:8080/ws
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
