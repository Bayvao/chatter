server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The service worker must be served from the root to control the whole
    # app, and must never be cached — a stale copy keeps running after a
    # deploy and browsers only re-check it when the bytes differ.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Client-side routing: unknown paths are React Router's to resolve, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
